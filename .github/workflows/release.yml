name: Release

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Version part to bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write  # push bump commit + tag, create release, upload assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      previous: ${{ steps.bump.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          PART: ${{ inputs.part }}
        run: |
          PREVIOUS=$(uv version --short)
          task release:bump PART="$PART"
          NEW=$(uv version --short)
          echo "previous=v${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      # Only the tag is pushed here so the builds can check out the bumped
      # commit; main is not updated until every build has succeeded.
      - name: Push tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: git push origin "$TAG"

  build-windows:
    name: Build master rack (Windows)
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Build executable
        run: uv run --python 3.11 python scripts/build_exe.py master_rack

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/master_rack.exe
          if-no-files-found: error

  build-macos:
    name: Build apps (macOS)
    needs: bump
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: astral-sh/setup-uv@v6

      - name: Install audio backend libraries
        run: brew install flac ffmpeg liblo libsndfile portaudio portmidi

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Build app
        run: uv run --python 3.11 python scripts/build_exe.py master_rack

      # hdiutil packs the .app into a compressed disk image
      - name: Create dmg
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          hdiutil create -volname master_rack -srcfolder dist/master_rack.app \
            -ov -format UDZO "master_rack-${TAG}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: master_rack-*-macos.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [bump, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: exes

      - name: Push bump commit to main
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: git push origin "HEAD:main"

      - name: Create GitHub release with master rack installers
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.bump.outputs.previous }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          START_ARGS=()
          if git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
            START_ARGS=(--notes-start-tag "$PREVIOUS")
          fi
          mv exes/windows-exe/master_rack.exe "master_rack-${TAG}-windows.exe"
          FILES=("master_rack-${TAG}-windows.exe" exes/macos-dmg/*.dmg)
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TAG" \
            --generate-notes \
            "${START_ARGS[@]}" \
            --verify-tag

  cleanup:
    name: Remove tag on failure
    needs: [bump, build-windows, build-macos, publish]
    if: ${{ always() && needs.bump.result == 'success' && (needs.build-windows.result != 'success' || needs.build-macos.result != 'success' || needs.publish.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete unreleased tag
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: git push origin ":refs/tags/$TAG"
