[project]
name = "pyoscillate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "KyleHarrison", email = "kyleharrison94@hotmail.com" }]
requires-python = ">=3.10"
dependencies = ["ipywidgets>=8.1.9", "pyo>=1.0.5", "wxpython>=4.3.1"]

[project.scripts]
pyoscillate = "pyoscillate:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.8"]

[tool.ruff.lint.per-file-ignores]
# __all__ is ordered to match each conceptual-map section, not alphabetically.
".claude/skills/pyo-music/references/pyo-api/**/*.py" = ["RUF022"]
