[project]
name = "pyoscillate"
version = "1.0.1"
description = "Agentic Pyo DSP patches played live as a modular synthesizer through a Flet GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KyleHarrison", email = "kyleharrison94@hotmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "demucs>=4.0.1",
    "flet>=1.0.0",
    "flet-mcp>=1.0.0",
    "ipykernel>=7.3.0",
    "librosa>=0.11.0",
    "pyo>=1.0.5",
    "wxpython>=4.3.1",
]

[project.scripts]
pyoscillate = "pyoscillate:main"
master-rack = "pyoscillate.cli:MasterRackCli.main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint.per-file-ignores]
# __all__ is ordered to match each conceptual-map section, not alphabetically.
".claude/skills/pyo-music/references/pyo-api/**/*.py" = ["RUF022"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the Flet app is imported as `src.flet...`, which needs the project root on sys.path
pythonpath = ["."]
# importlib mode lets tests/ mirror the src/pyoscillate/ layout without a
# tests/pyoscillate/ directory shadowing the real package
addopts = "--import-mode=importlib"
